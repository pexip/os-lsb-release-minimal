include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/recipes/debian.yml

variables:
  SALSA_CI_LINTIAN_FAIL_WARNING: "true"
  SALSA_CI_DISABLE_BUILD_PACKAGE_TWICE: "false"
  SALSA_CI_ENABLE_BUILD_PACKAGE_PROFILES: "true"

test-build-profiles:
  extends: .test-build-package-profiles
  parallel:
    matrix:
      - BUILD_PROFILES: nocheck
      - BUILD_PROFILES: nodoc
      - BUILD_PROFILES: nocheck,nodoc
